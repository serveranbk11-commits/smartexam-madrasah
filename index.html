<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartExam V35 — Generator Soal Otomatis STS, SAS, SAT, SAJ</title>

  <!-- Google Fonts: Plus Jakarta Sans, Inter & Playfair Display Italic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Export & File Parser Libraries (Client-Side Direct Download & Extraction) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Google Identity Services (Sign In / Sign Up dengan Akun Google Guru) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          },
          colors: {
            brand: {
              50: '#F5F3FF',
              100: '#EDE9FE',
              200: '#DDD6FE',
              300: '#C4B5FD',
              400: '#A78BFA',
              500: '#8B5CF6',
              600: '#7C3AED',
              700: '#6D28D9',
              800: '#5B21B6',
              900: '#2E1065',
              950: '#160B3B',
            }
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 12% 10%, #E0E7FF 0%, #F4F5FB 38%, #EDE9FE 76%, #F8FAFC 100%);
      --sidebar-gradient: linear-gradient(180deg, #272973 0%, #17154D 52%, #0E0B33 100%);
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 18px 40px -15px rgba(46, 16, 101, 0.08);
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #1E1B4B;
      overflow-x: hidden;
    }

    .font-accent-italic {
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }

    .glass-panel-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 45px -12px rgba(109, 40, 217, 0.14);
    }

    /* Floating Pill Sidebar V35 (Collapsible Hide/Show) */
    #sidebar-wrapper {
      width: 68px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease, margin 0.35s ease;
      flex-shrink: 0;
    }

    #sidebar-wrapper.sidebar-hidden {
      width: 0px;
      opacity: 0;
      margin-right: -12px;
      pointer-events: none;
      overflow: hidden;
    }

    .pill-sidebar {
      width: 64px;
      background: var(--sidebar-gradient);
      border-radius: 9999px;
      box-shadow: 0 24px 48px -12px rgba(14, 11, 51, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .nav-pill-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.62);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-pill-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.06);
    }

    .nav-pill-btn.active {
      background: radial-gradient(circle at 30% 30%, #FFFFFF 0%, #E0E7FF 100%);
      color: #17154D;
      box-shadow: 0 0 22px rgba(224, 231, 255, 0.88), 0 4px 12px rgba(14, 11, 51, 0.35);
      transform: scale(1.06);
    }

    .nav-pill-btn.active::after {
      content: '';
      position: absolute;
      right: -13px;
      width: 6px;
      height: 16px;
      background: #17154D;
      border-radius: 0 6px 6px 0;
      box-shadow: 0 0 8px rgba(23, 21, 77, 0.45);
    }

    .nav-tooltip {
      position: absolute;
      left: 60px;
      background: #17154D;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 10px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-6px);
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px rgba(14, 11, 51, 0.3);
      z-index: 90;
    }

    .nav-pill-btn:hover .nav-tooltip {
      opacity: 1;
      transform: translateX(0);
    }

    /* Futuristic Cyber-Glass Login UI */
    .cyber-auth-backdrop {
      background:
        radial-gradient(circle at 18% 20%, rgba(56, 189, 248, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 82% 78%, rgba(124, 58, 237, 0.28) 0%, transparent 46%),
        linear-gradient(135deg, #030712 0%, #071326 48%, #0A0F24 100%);
    }

    .cyber-ribbon-1 {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, transparent 22%, rgba(56, 189, 248, 0.14) 36%, rgba(14, 165, 233, 0.04) 48%, transparent 62%);
      pointer-events: none;
    }

    .cyber-card-frame {
      position: relative;
      background: linear-gradient(160deg, rgba(15, 28, 46, 0.86) 0%, rgba(9, 17, 32, 0.92) 100%);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(125, 211, 252, 0.28);
      box-shadow: 0 28px 70px -12px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(186, 230, 253, 0.25);
      clip-path: polygon(
        76px 0%,
        calc(100% - 24px) 0%,
        100% 24px,
        100% calc(100% - 76px),
        calc(100% - 76px) 100%,
        24px 100%,
        0% calc(100% - 24px),
        0% 76px
      );
    }

    .cyber-corner-tl {
      position: absolute;
      top: 0;
      left: 0;
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, rgba(30, 58, 95, 0.72), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 14px 4px 18px 4px;
      clip-path: polygon(0 0, 100% 0, 0 100%);
      pointer-events: none;
    }

    .cyber-corner-br {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 62px;
      height: 62px;
      background: linear-gradient(315deg, rgba(30, 58, 95, 0.72), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 18px 4px 14px 4px;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
      pointer-events: none;
    }

    .cyber-input-wrap {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(148, 163, 184, 0.22);
      transition: all 0.22s ease;
    }

    .cyber-input-wrap:focus-within {
      background: rgba(56, 189, 248, 0.07);
      border-color: #38BDF8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
    }

    .cyber-btn-primary {
      background: linear-gradient(90deg, #38BDF8 0%, #60A5FA 50%, #3B82F6 100%);
      color: #04101E;
      box-shadow: 0 10px 28px -6px rgba(56, 189, 248, 0.55);
      transition: all 0.25s ease;
    }

    .cyber-btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 14px 34px -6px rgba(56, 189, 248, 0.72);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(124, 58, 237, 0.24);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(124, 58, 237, 0.45);
    }

    .modal-backdrop { z-index: 1000; }
    .toast-layer { z-index: 2000; }
    .loading-layer { z-index: 9999; }

    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 0.45; }
      100% { transform: scale(0.92); opacity: 0.9; }
    }
    .animate-pulse-ring {
      animation: pulseRing 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="antialiased selection:bg-brand-600 selection:text-white">

  <!-- Z-INDEX 9999: GLOBAL LOADING OVERLAY -->
  <div id="global-loading" class="loading-layer fixed inset-0 hidden items-center justify-center bg-brand-950/60 backdrop-blur-md">
    <div class="bg-white/95 backdrop-blur-xl px-8 py-7 rounded-3xl shadow-2xl border border-brand-200 flex flex-col items-center max-w-xs w-full mx-4 text-center">
      <div class="relative w-16 h-16 flex items-center justify-center mb-4">
        <div class="absolute inset-0 rounded-full bg-brand-500/20 animate-pulse-ring"></div>
        <div class="w-12 h-12 rounded-full border-4 border-brand-200 border-t-brand-600 animate-spin"></div>
      </div>
      <h4 id="loading-title" class="text-base font-bold text-brand-950">Menghubungkan Server...</h4>
      <p id="loading-subtitle" class="text-xs text-slate-500 mt-1">Sinkronisasi data Google Apps Script</p>
    </div>
  </div>

  <!-- Z-INDEX 2000: TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="toast-layer fixed top-5 right-5 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Z-INDEX 1000: CONFIRMATION & ACTION MODAL -->
  <div id="confirm-modal" class="modal-backdrop fixed inset-0 hidden items-center justify-center bg-brand-950/50 backdrop-blur-sm p-4">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl max-w-md w-full p-6 shadow-2xl border border-white">
      <div class="flex items-start gap-4">
        <div id="confirm-modal-icon" class="w-12 h-12 rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center shrink-0">
          <i data-lucide="alert-circle" class="w-6 h-6"></i>
        </div>
        <div class="flex-1">
          <h3 id="confirm-modal-title" class="text-lg font-bold text-brand-950">Konfirmasi Tindakan</h3>
          <p id="confirm-modal-message" class="text-sm text-slate-600 mt-1.5 leading-relaxed">Apakah Anda yakin melanjutkan proses ini?</p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-3 mt-6">
        <button id="confirm-modal-cancel" type="button" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Batal</button>
        <button id="confirm-modal-ok" type="button" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/25 transition">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <!-- Z-INDEX 1000: MODAL TAMBAH / EDIT AKUN GURU -->
  <div id="user-modal" class="modal-backdrop fixed inset-0 hidden items-center justify-center bg-brand-950/50 backdrop-blur-sm p-4">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl border border-white max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-brand-600">Manajemen Pengguna</span>
          <h3 id="user-modal-title" class="text-xl font-bold text-brand-950">Tambah Akun Guru Mapel</h3>
        </div>
        <button onclick="closeUserModal()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form id="user-form" class="mt-5 space-y-4">
        <input type="hidden" id="edit-user-id" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nama Lengkap & Gelar</label>
            <input type="text" id="user-nama" required placeholder="Contoh: Dra. Siti Aminah, M.Pd" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">NIP / NUPTK</label>
            <input type="text" id="user-nip" placeholder="198504122010012014" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm outline-none" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email / Username Login</label>
            <input type="text" id="user-username" required placeholder="guru@madrasah.sch.id" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password <span id="user-pass-hint" class="text-slate-400 font-normal">(Wajib diisi)</span></label>
            <div class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl border border-slate-200 focus-within:border-brand-500 bg-white">
              <input type="password" id="user-password" placeholder="Minimal 6 karakter" class="w-full text-sm outline-none bg-transparent" />
              <button type="button" onclick="togglePasswordVisibility('user-password', 'user-modal-eye')" class="text-slate-400 hover:text-brand-600">
                <i id="user-modal-eye" data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Hak Akses (Role)</label>
            <select id="user-role" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 text-sm outline-none bg-white">
              <option value="GURU">Guru Mata Pelajaran</option>
              <option value="ADMIN">Admin / Operator Kurikulum</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Mata Pelajaran Diampu</label>
            <input type="text" id="user-mapel" required placeholder="Contoh: Biologi / Fikih / Matematika" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm outline-none" />
          </div>
        </div>
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeUserModal()" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100">Batal</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-indigo-600 hover:opacity-95 shadow-lg shadow-brand-500/25">Simpan Akun</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Z-INDEX 1000: MODAL ADMIN RESET PASSWORD GURU -->
  <div id="admin-reset-modal" class="modal-backdrop fixed inset-0 hidden items-center justify-center bg-brand-950/55 backdrop-blur-sm p-4">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl max-w-md w-full p-6 shadow-2xl border border-brand-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <span class="text-[11px] font-bold uppercase tracking-wider text-amber-600">Keamanan Akun</span>
          <h3 class="text-lg font-bold text-brand-950">Reset Password Guru</h3>
        </div>
        <button onclick="closeAdminResetModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form id="admin-reset-form" class="mt-4 space-y-4">
        <input type="hidden" id="reset-target-user-id" />
        <div class="p-3 rounded-2xl bg-brand-50 border border-brand-100 text-xs text-brand-900">
          Target Akun: <b id="reset-target-user-label">-</b>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password Baru</label>
          <div class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus-within:border-brand-500">
            <input type="password" id="admin-new-password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full text-sm outline-none bg-transparent" />
            <button type="button" onclick="togglePasswordVisibility('admin-new-password', 'admin-reset-eye')" class="text-slate-400 hover:text-brand-600">
              <i id="admin-reset-eye" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-end gap-2.5 pt-2">
          <button type="button" onclick="closeAdminResetModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Batal</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-600 hover:bg-amber-700 text-white shadow-lg shadow-amber-500/25">Simpan Password Baru</button>
        </div>
      </form>
    </div>
  </div>

  <!-- AUTH GUARD ROOT (ONLY LOGIN UI RENDERED BEFORE AUTHENTICATION) -->
  <div id="auth-root" class="relative min-h-screen flex items-center justify-center p-4"></div>

  <!-- AUTHENTICATED DASHBOARD SHELL TEMPLATE (INJECTED ONLY AFTER VALID LOGIN) -->
  <template id="app-shell-template">

          <div class="flex flex-col items-center gap-4">

                <circle cx="12" cy="5.5" r="2.7" fill="white" />

                <circle cx="12" cy="18.5" r="2.7" fill="white" />

            <!-- Primary Navigation Icons -->
            <nav class="flex flex-col items-center gap-2.5 mt-1">

                <span class="nav-tooltip">Dashboard Analitik</span>

              <button data-nav="generator" onclick="switchTab('generator')" class="nav-pill-btn">

                <span class="nav-tooltip">Generator Soal Otomatis</span>

              <button data-nav="bank-soal" onclick="switchTab('bank-soal')" class="nav-pill-btn">

                <span class="nav-tooltip">Bank Soal & Kunci</span>

              <button id="nav-users-btn" data-nav="users" onclick="switchTab('users')" class="nav-pill-btn hidden">

              <button data-nav="settings" onclick="switchTab('settings')" class="nav-pill-btn">

                <span class="nav-tooltip">Pengaturan Madrasah & Kop</span>

          </div>

          <!-- Bottom Utility Icons -->
          <div class="flex flex-col items-center gap-2.5 pt-3 border-t border-white/10">
            <button onclick="focusGlobalSearch()" class="nav-pill-btn" title="Pencarian Cepat">
              <i data-lucide="search" class="w-4 h-4"></i>
              <span class="nav-tooltip">Cari Soal / Mapel</span>
            </button>

            <button onclick="toggleSidebarVisibility()" class="nav-pill-btn" title="Sembunyikan Sidebar">
              <i data-lucide="panel-left-close" class="w-4 h-4"></i>
              <span class="nav-tooltip">Sembunyikan Sidebar</span>

    async function callBackendAPI(action, payload = {}) {
      if (APP_SCRIPT_URL.includes("YOUR_SCRIPT_ID")) {
        throw new Error("URL Google Apps Script belum dikonfigurasi pada index.html (APP_SCRIPT_URL).");
      }

      const body = JSON.stringify({
        action: action,
        token: sessionToken || sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY) || '',
        payload: payload
      });

      const response = await fetch(APP_SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: body
      });

      if (!response.ok) {
        throw new Error(`HTTP Error ${response.status}: Gagal terhubung ke server.`);
      }

      const result = await response.json();
      if (!result.success) {
        if (result.code === 'UNAUTHORIZED') {
          handleSessionExpired();
        }
        throw new Error(result.message || 'Terjadi kesalahan pada server.');
      }
      return result;
    }

    function handleSessionExpired() {
      sessionStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem('SMARTEXAM_USER');
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem('SMARTEXAM_USER');
      sessionToken = null;
      currentUser = null;

      renderLoginGate('login');

      const container = document.getElementById('toast-container');

        error: 'border-rose-200 bg-white/95 text-rose-900',

        error: 'text-rose-600',
        info: 'text-brand-600'
      };

      const toast = document.createElement('div');

      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

        : 'px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/25 transition';

        : 'w-12 h-12 rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center shrink-0';

      modal.classList.remove('hidden');
      modal.classList.add('flex');

    async function finalizeLoginSession(authData, remember = false) {
      sessionToken = authData.token;
      currentUser = authData.user;
      sessionStorage.setItem(SESSION_KEY, sessionToken);
      sessionStorage.setItem('SMARTEXAM_USER', JSON.stringify(currentUser));
      if (remember) {
        localStorage.setItem(SESSION_KEY, sessionToken);
        localStorage.setItem('SMARTEXAM_USER', JSON.stringify(currentUser));
      }

      const authRoot = document.getElementById('auth-root');
      authRoot.className = 'hidden';
      await mountAuthenticatedDashboard();
      hideLoading();
      showToast(`Selamat datang, ${currentUser.nama}!`, 'success');
    }

      verForm.addEventListener('submit', async (e) => {

    function decodeJwtPayload(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(jsonPayload);
    }

    function triggerGoogleSignInFlow() {
      if (!window.google || !google.accounts || !google.accounts.id || GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID')) {
        showToast('Konfigurasi GOOGLE_CLIENT_ID di index.html diperlukan untuk Google OAuth One-Tap. Gunakan formulir Sign Up / Sign In Email.', 'info');
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: async (response) => {
          try {
            const profile = decodeJwtPayload(response.credential);
            showLoading('Verifikasi Akun Google...', `Memeriksa akun ${profile.email}`);
            const res = await callBackendAPI('google_auth', {
              idToken: response.credential,
              email: profile.email,
              nama: profile.name,
              picture: profile.picture
            });

            if (res.data && res.data.needsRegistration) {
              hideLoading();
              pendingGoogleProfile = {
                idToken: response.credential,
                email: profile.email,
                name: profile.name,
                picture: profile.picture
              };
              renderLoginGate('google-complete');
              showToast('Akun Google terverifikasi! Lengkapi mata pelajaran yang diampu.', 'info');
              return;
            }

            await finalizeLoginSession(res.data, true);
          } catch (err) {
            hideLoading();
            showToast(err.message, 'error');
          }
        }
      });

      google.accounts.id.prompt();
    }

    function togglePasswordVisibility(inputId, iconId) {
      const inputEl = document.getElementById(inputId);
      const iconEl = document.getElementById(iconId);
      if (!inputEl || !iconEl) return;
      const isHidden = inputEl.type === 'password';
      inputEl.type = isHidden ? 'text' : 'password';
      iconEl.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    // 5. FILE UPLOAD KE GOOGLE DRIVE & PARSER MATERI (PDF, DOCX, TXT, IMAGE)

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
      });
    }

    async function uploadFileToDriveBackend(file, modul, identifier) {
      const base64Data = await fileToBase64(file);
      const res = await callBackendAPI('upload_file', {
        base64Data: base64Data,
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
        modul: modul,
        identifier: identifier
      });
      return res.data.url;
    }

    async function handleMateriFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      showLoading('Mengekstrak & Mengunggah Materi...', `Membaca isi ${file.name} & menyimpan ke Drive`);
      try {
        let extractedText = '';
        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'txt') {
          extractedText = await file.text();
        } else if (ext === 'docx' && window.mammoth) {
          const arrayBuffer = await file.arrayBuffer();
          const res = await mammoth.extractRawText({ arrayBuffer });
          extractedText = res.value;
        } else if (ext === 'pdf' && window.pdfjsLib) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const maxPages = Math.min(pdf.numPages, 8);
          for (let p = 1; p <= maxPages; p++) {
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            extractedText += content.items.map((it) => it.str).join(' ') + '\n';
          }
        }

        const driveUrl = await uploadFileToDriveBackend(file, 'MATERI', currentUser.username);
        uploadedMateriFileUrl = driveUrl;
        uploadedMateriFileName = file.name;

        if (extractedText.trim()) {
          document.getElementById('gen-materi-text').value = extractedText.trim().slice(0, 4500);
        }
        if (!document.getElementById('gen-judul-bab').value.trim()) {
          document.getElementById('gen-judul-bab').value = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]/g, ' ');
        }

        document.getElementById('uploaded-materi-name').textContent = file.name;
        document.getElementById('uploaded-materi-badge').classList.remove('hidden');
        hideLoading();
        showToast('Materi berhasil diekstrak dan diarsipkan ke Google Drive!', 'success');
      } catch (err) {
        hideLoading();
        showToast('Gagal memproses file materi: ' + err.message, 'error');
      }
    }

    // 6. SMART QUESTION GENERATOR ENGINE (RISET TERBUKA + MULTI-TIPE)
    // =========================================================================
    async function fetchTopicKnowledgeFromOpenSource(topic, mapel) {
      try {
        const query = encodeURIComponent(topic);
        const searchUrl = `https://id.wikipedia.org/w/api.php?action=query&list=search&srsearch=${query}&format=json&origin=*`;
        const sRes = await fetch(searchUrl);
        const sJson = await sRes.json();
        const hits = sJson?.query?.search || [];

        if (hits.length > 0) {
          const topTitle = encodeURIComponent(hits[0].title);
          const sumUrl = `https://id.wikipedia.org/api/rest_v1/page/summary/${topTitle}`;
          const sumRes = await fetch(sumUrl);
          if (sumRes.ok) {
            const sumData = await sumRes.json();
            if (sumData.extract && sumData.extract.length > 60) {
              return {
                sourceTitle: sumData.title,
                sourceUrl: sumData.content_urls?.desktop?.page || `https://www.google.com/search?q=${encodeURIComponent(topic + ' ' + mapel)}`,
                text: sumData.extract
              };
            }
          }
        }
      } catch (e) {}

      return {
        sourceTitle: topic,
        sourceUrl: `https://www.google.com/search?q=${encodeURIComponent(`materi dan soal ${topic} ${mapel}`)}`,
        text: `${topic} merupakan salah satu pokok bahasan fundamental dalam mata pelajaran ${mapel}. Pemahaman mendalam mengenai prinsip dasar, mekanisme kerja, faktor yang memengaruhi, serta penerapan ${topic} dalam kehidupan sehari-hari menjadi indikator utama pencapaian kompetensi peserta didik. Analisis hubungan sebab-akibat pada konsep ${topic} membantu memecahkan permasalahan kontekstual secara sistematis dan terukur.`
      };
    }

    async function generateAutomaticQuestions() {
      const jenisKode = document.getElementById('gen-jenis-ujian').value;
      const jenisNamaMap = {
        STS: 'SUMATIF TENGAH SEMESTER (STS)',
        SAS: 'SUMATIF AKHIR SEMESTER (SAS)',
        SAT: 'SUMATIF AKHIR TAHUN (SAT)',
        SAJ: 'SUMATIF AKHIR JENJANG (SAJ)'
      };
      const mapel = document.getElementById('gen-mapel').value.trim() || currentUser.mapel || 'Mata Pelajaran Umum';
      const kelas = document.getElementById('gen-kelas').value.trim() || 'XI';
      const waktu = document.getElementById('gen-waktu').value.trim() || '90 Menit';
      const judulBab = document.getElementById('gen-judul-bab').value.trim();
      let rawMateri = document.getElementById('gen-materi-text').value.trim();

      if (!judulBab && !rawMateri) {
        showToast('Isi Judul Bab / Topik Materi terlebih dahulu!', 'error');
        return;
      }

      const topikUtama = judulBab || rawMateri.split('.')[0].slice(0, 60);
      showLoading('Meriset & Menyusun Soal...', `Mengembangkan butir soal otomatis untuk "${topikUtama}"`);

      try {
        let refInfo = {
          sourceTitle: topikUtama,
          sourceUrl: `https://www.google.com/search?q=${encodeURIComponent(`soal ${topikUtama} ${mapel}`)}`,
          text: rawMateri
        };

        if (rawMateri.length < 120) {
          refInfo = await fetchTopicKnowledgeFromOpenSource(topikUtama, mapel);
          if (!rawMateri) {
            rawMateri = refInfo.text;
            document.getElementById('gen-materi-text').value = rawMateri;
          }
        }

        const sentences = rawMateri
          .split(/[.!?]+/)
          .map((s) => s.trim())
          .filter((s) => s.length > 25);

        const poolSentences = sentences.length ? sentences : [
          `Konsep utama pada bab ${topikUtama} menekankan pada analisis prinsip dasar dan penerapannya dalam mata pelajaran ${mapel}.`,
          `Faktor penentu keberhasilan analisis pada materi ${topikUtama} adalah ketepatan mengidentifikasi variabel dan hubungan kausalitasnya.`,
          `Penerapan konsep ${topikUtama} secara sistematis memungkinkan penyelesaian studi kasus kontekstual pada tingkat ${kelas}.`
        ];

        const generatedList = [];
        let cursor = 0;
        const nextFact = () => {
          const f = poolSentences[cursor % poolSentences.length];
          cursor++;
          return f;
        };

        // 1. Pilihan Ganda (PG)
        if (document.getElementById('chk-pg').checked) {
          const qty = Math.max(1, parseInt(document.getElementById('qty-pg').value || '5', 10));
          for (let i = 0; i < qty; i++) {
            const fact = nextFact();
            const letters = ['A', 'B', 'C', 'D', 'E'];
            const correctIdx = i % 5;
            const correctLetter = letters[correctIdx];
            const distractors = [
              `Mengabaikan prinsip dasar ${topikUtama} dalam penyelesaian masalah ${mapel}`,
              `Pernyataan yang bertentangan dengan kaidah ilmiah pada bab ${topikUtama}`,
              `Pendekatan parsial tanpa mempertimbangkan variabel utama ${topikUtama}`,
              `Kesimpulan umum yang tidak didukung oleh data empiris pada ${topikUtama}`
            ];
            let dIdx = 0;
            const opsi = letters.map((L, idx) => {
              if (idx === correctIdx) return `${L}. ${fact}`;
              const text = distractors[dIdx % distractors.length];
              dIdx++;
              return `${L}. ${text}`;
            });

            generatedList.push({
              tipe: 'PG',
              labelTipe: 'Pilihan Ganda',
              pertanyaan: `Berdasarkan kajian materi <b>${topikUtama}</b> pada mata pelajaran ${mapel}, pernyataan yang paling tepat menggambarkan konsep tersebut adalah ....`,
              gambar: i === 0 ? uploadedStimulusImageUrl : '',
              opsi: opsi,
              kunci: correctLetter,
              pembahasan: `Sesuai konsep inti pada bab ${topikUtama}: "${fact}" (Jawaban: ${correctLetter}).`,
              level: 'Sedang (C3)'
            });
          }
        }

        // 2. Pilihan Ganda Kompleks (PGK)
        if (document.getElementById('chk-pgk').checked) {
          const qty = Math.max(1, parseInt(document.getElementById('qty-pgk').value || '2', 10));
          for (let i = 0; i < qty; i++) {
            const f1 = nextFact();
            const f2 = nextFact();
            generatedList.push({
              tipe: 'PGK',
              labelTipe: 'Pilihan Ganda Kompleks',
              pertanyaan: `Perhatikan pernyataan berikut terkait <b>${topikUtama}</b>! Pilihlah <b>dua (2)</b> pernyataan yang benar berdasarkan konsep ${mapel}:`,
              gambar: '',
              opsi: [
                `[1] ${f1}`,
                `[2] Konsep ${topikUtama} tidak memiliki keterkaitan dengan analisis fenomena ${mapel}`,
                `[3] ${f2}`,
                `[4] Penerapan ${topikUtama} hanya berlaku pada kondisi tanpa variabel pengontrol`
              ],
              kunci: 'Pernyataan [1] dan [3]',
              pembahasan: `Pernyataan [1] dan [3] sesuai dengan kaidah materi ${topikUtama}.`,
              level: 'HOTS (C4)'
            });
          }
        }

        // 3. Menjodohkan
        if (document.getElementById('chk-jodoh').checked) {
          const qty = Math.max(1, parseInt(document.getElementById('qty-jodoh').value || '2', 10));
          for (let i = 0; i < qty; i++) {
            const f1 = nextFact();
            generatedList.push({
              tipe: 'MENJODOHKAN',
              labelTipe: 'Menjodohkan',
              pertanyaan: `Pasangkan premis konsep pada lajur kiri dengan deskripsi yang tepat pada lajur kanan mengenai materi <b>${topikUtama}</b>:`,
              gambar: '',
              opsi: [
                `Premis A: Konsep Inti ${topikUtama}  --->  Pasangan 1: ${f1}`,
                `Premis B: Analisis Aplikasi ${mapel}  --->  Pasangan 2: Penerapan prinsip ${topikUtama} untuk memecahkan studi kasus kontekstual`
              ],
              kunci: 'Premis A = Pasangan 1; Premis B = Pasangan 2',
              pembahasan: `Kesesuaian definisi dan penerapan konseptual pada bab ${topikUtama}.`,
              level: 'Sedang (C3)'
            });
          }
        }

        // 4. Isian Singkat
        if (document.getElementById('chk-isian').checked) {
          const qty = Math.max(1, parseInt(document.getElementById('qty-isian').value || '2', 10));
          for (let i = 0; i < qty; i++) {
            generatedList.push({
              tipe: 'ISIAN',
              labelTipe: 'Isian Singkat',
              pertanyaan: `Pokok bahasan utama dalam mata pelajaran ${mapel} yang mengkaji prinsip dasar serta keterkaitan antarvariabel pada materi ini disebut ....`,
              gambar: '',
              opsi: [],
              kunci: topikUtama,
              pembahasan: `Jawaban merujuk langsung pada topik kajian utama yaitu ${topikUtama}.`,
              level: 'Mudah (C2)'
            });
          }
        }

        // 5. Uraian / Esai
        if (document.getElementById('chk-uraian').checked) {
          const qty = Math.max(1, parseInt(document.getElementById('qty-uraian').value || '2', 10));
          for (let i = 0; i < qty; i++) {
            const fact = nextFact();
            generatedList.push({
              tipe: 'URAIAN',
              labelTipe: 'Uraian / Esai',
              pertanyaan: `Jelaskan secara sistematis bagaimana prinsip dasar <b>${topikUtama}</b> diterapkan untuk menyelesaikan permasalahan nyata dalam bidang ${mapel}!`,
              gambar: '',
              opsi: [],
              kunci: `Prinsip ${topikUtama} diterapkan dengan mengidentifikasi konsep inti (${fact}), menganalisis faktor yang memengaruhi, lalu merumuskan solusi yang terukur.`,
              pembahasan: `Rubrik penilaian: Ketepatan konsep (40%), alur analisis logis (40%), dan kesimpulan kontekstual (20%).`,
              level: 'HOTS (C5)'
            });
          }
        }

        currentGeneratedPaket = {
          jenisKode,
          jenisNama: jenisNamaMap[jenisKode] || jenisKode,
          mapel,
          kelas,
          waktu,
          judulBab: topikUtama,
          tahunAjaran: appState.settings.taValue,
          semester: appState.settings.semester,
          kopUrl: appState.settings.kopUrl,
          sourceUrl: refInfo.sourceUrl,
          soal: generatedList
        };

        renderGeneratedPreview();
        hideLoading();
        showToast(`Berhasil membuat ${generatedList.length} butir soal & kunci jawaban untuk bab "${topikUtama}"!`, 'success');
      } catch (err) {
        hideLoading();
        showToast('Gagal mengembangkan soal: ' + err.message, 'error');
      }
    }

    function getExportFilename(ext) {
      const p = currentGeneratedPaket;
      const cleanMapel = (p?.mapel || 'soal').toLowerCase().replace(/[^a-z0-9]/g, '_');
      const jenis = (p?.jenisKode || 'ujian').toLowerCase();
      const tgl = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      return `naskah_${jenis}_${cleanMapel}_${tgl}.${ext}`;
    }

    function exportExamToPDF() {
      if (!currentGeneratedPaket) {
        showToast('Generate soal terlebih dahulu sebelum mengekspor PDF.', 'error');
        return;
      }
      showLoading('Membuat File PDF...', 'Menyusun naskah soal & lembar kunci jawaban');
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const p = currentGeneratedPaket;
        const s = appState.settings;

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.text(s.induk.toUpperCase(), 105, 14, { align: 'center' });
        doc.setFontSize(13);
        doc.text(s.namaMadrasah.toUpperCase(), 105, 20, { align: 'center' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8.5);
        doc.text(s.alamat, 105, 25, { align: 'center' });
        doc.setLineWidth(0.7);
        doc.line(15, 28, 195, 28);

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text(`NASKAH SOAL ${p.jenisNama}`, 105, 35, { align: 'center' });
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.text(`Mapel: ${p.mapel}  |  Kelas: ${p.kelas}  |  TA: ${p.tahunAjaran} (${p.semester})  |  Waktu: ${p.waktu}`, 105, 41, { align: 'center' });

        let y = 50;
        p.soal.forEach((item, idx) => {
          if (y > 265) {
            doc.addPage();
            y = 18;
          }
          const cleanQ = item.pertanyaan.replace(/<[^>]*>?/gm, '');
          const lines = doc.splitTextToSize(`${idx + 1}. [${item.labelTipe}] ${cleanQ}`, 178);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9.5);
          doc.text(lines, 15, y);
          y += lines.length * 4.8 + 1;

          if (item.opsi && item.opsi.length) {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            item.opsi.forEach((op) => {
              if (y > 272) {
                doc.addPage();
                y = 18;
              }
              const opLines = doc.splitTextToSize(op, 172);
              doc.text(opLines, 20, y);
              y += opLines.length * 4.4;
            });
          }
          y += 3;
        });

        // Halaman Kunci Jawaban
        doc.addPage();
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(12);
        doc.text(`KUNCI JAWABAN & PEMBAHASAN — ${p.jenisNama}`, 105, 18, { align: 'center' });

        doc.autoTable({
          startY: 25,
          head: [['No', 'Tipe Soal', 'Kunci Jawaban', 'Pembahasan Ringkas']],
          body: p.soal.map((item, i) => [i + 1, item.labelTipe, item.kunci, item.pembahasan]),
          styles: { fontSize: 8.5, cellPadding: 2.5 },
          headStyles: { fillColor: [91, 33, 182] }
        });

        doc.save(getExportFilename('pdf'));
        hideLoading();
        showToast('File PDF Naskah & Kunci Jawaban berhasil diunduh!', 'success');
      } catch (err) {
        hideLoading();
        showToast('Gagal membuat PDF: ' + err.message, 'error');
      }
    }

        showToast('Generate soal terlebih dahulu sebelum mengekspor Word.', 'error');
        return;
      }
      const p = currentGeneratedPaket;

      const wordHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Naskah Soal</title></head>

          ${p.soal.map((item, i) => `
            <p><b>${i + 1}. [${item.labelTipe}]</b> ${item.pertanyaan}</p>
            ${item.opsi && item.opsi.length ? `<ul>${item.opsi.map((o) => `<li>${o}</li>`).join('')}</ul>` : ''}
          `).join('')}
          <br pagebreak="true" />
          <h3>KUNCI JAWABAN & PEMBAHASAN</h3>
          <table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse; font-size:10pt;">
            <tr style="background:#EDE9FE;"><th>No</th><th>Tipe</th><th>Kunci Jawaban</th><th>Pembahasan</th></tr>

            `).join('')}

      const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);

      a.href = url;
      a.download = getExportFilename('doc');

    async function searchQuestionReferences() {
      const inputEl = document.getElementById('ref-search-query');
      const query = (inputEl?.value || 'Sistem Peredaran Darah Manusia').trim();
      const jenjang = document.getElementById('ref-jenjang')?.value || 'MA / SMA';
      const grid = document.getElementById('referensi-results-grid');

      liveContainer.innerHTML = `
        <div class="glass-panel p-5 flex items-center gap-3 text-xs text-brand-800">
          <div class="w-5 h-5 rounded-full border-2 border-brand-200 border-t-brand-600 animate-spin shrink-0"></div>
          <span>Menelusuri ringkasan materi & referensi soal untuk topik <b>"${query}"</b>...</span>
        </div>

      // 1. Ambil Referensi Materi Langsung dari Open Knowledge API (Wikipedia ID)
      let liveArticlesHtml = '';
      try {
        const apiUrl = `https://id.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=3&format=json&origin=*`;
        const resp = await fetch(apiUrl);
        const data = await resp.json();
        const results = data?.query?.search || [];

        if (results.length > 0) {
          liveArticlesHtml = `
            <div class="glass-panel p-5 space-y-3">

                <h3 class="text-sm font-extrabold text-brand-950 flex items-center gap-2">

              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                ${results.map((item) => {
                  const cleanSnippet = item.snippet.replace(/<[^>]*>?/gm, '');
                  const articleUrl = `https://id.wikipedia.org/wiki/${encodeURIComponent(item.title.replace(/ /g, '_'))}`;
                  return `
                    <div class="p-4 rounded-2xl bg-white border border-slate-200/90 flex flex-col justify-between gap-3">
                      <div>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-brand-600">Ensiklopedia Terbuka</span>
                        <h4 class="font-bold text-xs sm:text-sm text-brand-950 mt-1">${item.title}</h4>
                        <p class="text-xs text-slate-600 mt-1.5 line-clamp-3 leading-relaxed">${cleanSnippet}...</p>
                      </div>
                      <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                        <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold">Baca Sumber</a>
                        <button type="button" onclick="applySnippetToGenerator('${item.title.replace(/'/g, "\\'")}', '${cleanSnippet.replace(/'/g, "\\'")}')" class="flex-1 py-1.5 px-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-[11px] font-bold">Jadikan Soal</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        } else {
          liveArticlesHtml = `
            <div class="glass-panel p-4 text-xs text-slate-600">
              Tidak ditemukan ringkasan ensiklopedia langsung untuk <b>"${query}"</b>. Gunakan portal multi-sumber di bawah untuk menelusuri dokumen soal dan PDF.
            </div>
          `;
        }
      } catch (e) {
        liveArticlesHtml = '';
      }

      liveContainer.innerHTML = liveArticlesHtml;

      // 2. Portal Multi-Sumber Eksternal (Google Web, Pusmendik AKM, Repositori PDF/DOCX, & Google Scholar)
      const sources = [
        {
          name: 'Google Search Bank Soal',
          badge: 'Web Lengkap',
          desc: `Kumpulan naskah soal latihan & kunci jawaban "${query}" tingkat ${jenjang}.`,
          url: `https://www.google.com/search?q=${encodeURIComponent(`bank soal ${query} ${jenjang} dan kunci jawaban`)}`
        },
        {
          name: 'Pusmendik Kemendikbud (AKM)',
          badge: 'Resmi Nasional',
          desc: `Stimulus literasi, numerasi, dan contoh soal HOTS terkait "${query}".`,
          url: `https://www.google.com/search?q=${encodeURIComponent(`site:pusmendik.kemdikbud.go.id ${query}`)}`
        },
        {
          name: 'Repositori PDF & DOC Naskah',
          badge: 'File Dokumen',
          desc: `Pencarian langsung file PDF/DOCX latihan ujian "${query}" siap unduh.`,
          url: `https://www.google.com/search?q=${encodeURIComponent(`soal ${query} ${jenjang} filetype:pdf`)}`
        },
        {
          name: 'Kemenag / Madrasah Digital',
          badge: 'Portal Madrasah',
          desc: `Referensi materi ajar & evaluasi kurikulum madrasah topik "${query}".`,
          url: `https://www.google.com/search?q=${encodeURIComponent(`site:madrasah.kemenag.go.id ${query}`)}`
        },
        {
          name: 'Google Scholar & Jurnal',
          badge: 'Akademik',
          desc: `Kajian ilmiah dan konsep mendalam untuk penyusunan soal HOTS "${query}".`,
          url: `https://scholar.google.com/scholar?q=${encodeURIComponent(query)}`
        },
        {
          name: 'Ruangguru / Quizizz Publik',
          badge: 'Latihan Interaktif',
          desc: `Referensi variasi bentuk soal pilihan ganda dan uraian topik "${query}".`,
          url: `https://www.google.com/search?q=${encodeURIComponent(`site:quizizz.com OR site:ruangguru.com soal ${query}`)}`
        }
      ];

      grid.innerHTML = sources.map((src) => `
        <div class="glass-panel glass-panel-hover p-5 flex flex-col justify-between gap-4">
          <div>
            <span class="px-2.5 py-1 rounded-full bg-brand-100 text-brand-700 text-[10px] font-bold">${src.badge}</span>
            <h4 class="font-bold text-base text-brand-950 mt-2.5">${src.name}</h4>
            <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">${src.desc}</p>
          </div>
          <div class="flex items-center gap-2 pt-2">
            <a href="${src.url}" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 px-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold text-center transition">Buka Sumber ↗</a>
            <button type="button" onclick="useReferenceTopic('${query.replace(/'/g, "\\'")}')" class="py-2.5 px-3 rounded-xl bg-brand-50 hover:bg-brand-100 text-brand-700 text-xs font-bold transition">Gunakan Topik</button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function applySnippetToGenerator(title, snippet) {
      switchTab('generator');
      document.getElementById('gen-judul-bab').value = title;
      document.getElementById('gen-materi-text').value = snippet;
      showToast(`Referensi "${title}" berhasil dimuat ke Generator Soal!`, 'success');
    }

    function useReferenceTopic(topic) {
      switchTab('generator');
      document.getElementById('gen-judul-bab').value = topic;
      showToast(`Topik "${topic}" diterapkan ke Generator Soal!`, 'info');
    }

    function syncSettingsToUI() {
      const s = appState.settings;
      if (s.taMode === 'AUTO') {
        const now = new Date();
        const yr = now.getFullYear();
        s.taValue = now.getMonth() >= 6 ? `${yr}/${yr + 1}` : `${yr - 1}/${yr}`;
      }
      document.getElementById('header-madrasah-title').textContent = s.namaMadrasah;
      document.getElementById('header-ta-badge').textContent = `TA ${s.taValue} (${s.semester})`;
      if (s.logoUrl) {
        document.getElementById('header-logo-img').src = s.logoUrl;
        const prevLogo = document.getElementById('settings-logo-preview');
        if (prevLogo) prevLogo.src = s.logoUrl;
      }
      const setMap = {
        'set-nama-madrasah': s.namaMadrasah,
        'set-induk': s.induk,
        'set-alamat': s.alamat,
        'set-ta-mode': s.taMode,
        'set-ta-value': s.taValue,
        'set-semester': s.semester,
        'set-kepala': s.kepala,
        'set-nip-kepala': s.nipKepala,
        'set-logo-url': s.logoUrl,
        'set-kop-url': s.kopUrl
      };
      Object.keys(setMap).forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = setMap[id] || '';
      });
      renderKopPreview();
    }

    function toggleTahunAjaranMode() {
      const mode = document.getElementById('set-ta-mode').value;
      const valInput = document.getElementById('set-ta-value');
      if (mode === 'AUTO') {
        const now = new Date();
        const yr = now.getFullYear();
        valInput.value = now.getMonth() >= 6 ? `${yr}/${yr + 1}` : `${yr - 1}/${yr}`;
        valInput.readOnly = true;
      } else {
        valInput.readOnly = false;
      }
    }

    function syncLogoPreviewFromUrl(url) {
      if (url && url.startsWith('http')) {
        document.getElementById('settings-logo-preview').src = url;
      }
    }

    function syncKopPreviewFromUrl(url) {
      appState.settings.kopUrl = url.trim();
      renderKopPreview();
    }

    async function handleLogoFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      showLoading('Mengunggah Logo...', 'Menyimpan logo madrasah ke Google Drive');
      try {
        const url = await uploadFileToDriveBackend(file, 'LOGO', 'madrasah');
        document.getElementById('set-logo-url').value = url;
        document.getElementById('settings-logo-preview').src = url;
        hideLoading();
        showToast('Logo madrasah berhasil diunggah ke Google Drive!', 'success');
      } catch (err) {
        hideLoading();
        showToast(err.message, 'error');
      }
    }

    async function handleKopFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      showLoading('Mengunggah Kop Surat...', 'Menyimpan gambar kop surat ke Google Drive');
      try {
        const url = await uploadFileToDriveBackend(file, 'KOP_SURAT', 'madrasah');
        document.getElementById('set-kop-url').value = url;
        appState.settings.kopUrl = url;
        renderKopPreview();
        hideLoading();
        showToast('Gambar Kop Surat berhasil diunggah ke Google Drive!', 'success');
      } catch (err) {
        hideLoading();
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('submit', async (e) => {
      if (e.target && e.target.id === 'settings-form') {
        e.preventDefault();
        const payload = {
          induk: document.getElementById('set-induk').value.trim(),
          namaMadrasah: document.getElementById('set-nama-madrasah').value.trim(),
          alamat: document.getElementById('set-alamat').value.trim(),
          taMode: document.getElementById('set-ta-mode').value,
          taValue: document.getElementById('set-ta-value').value.trim(),
          semester: document.getElementById('set-semester').value,
          kepala: document.getElementById('set-kepala').value.trim(),
          nipKepala: document.getElementById('set-nip-kepala').value.trim(),
          logoUrl: document.getElementById('set-logo-url').value.trim(),
          kopUrl: document.getElementById('set-kop-url').value.trim()
        };

        showLoading('Menyimpan Pengaturan...', 'Memperbarui konfigurasi madrasah di Google Sheets');
        try {
          await callBackendAPI('save_settings', payload);
          Object.assign(appState.settings, payload);
          syncSettingsToUI();
          hideLoading();
          showToast('Pengaturan madrasah & kop surat berhasil disimpan!', 'success');
        } catch (err) {
          hideLoading();
          showToast(err.message, 'error');
        }
      }
    });
  </script>
</body>
</html>
